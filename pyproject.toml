[project]
name = "hitokoto"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "rich",
    "huggingface-hub",
    "tokenizers",
    "pyarrow",
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
test = ["pytest", "hypothesis"]

# Settings for the checks in docs/coding_rules.md (ruff check and pyright only, no formatter)

[tool.ruff]
line-length = 250

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]   # __init__.py の import を「未使用」扱いしない

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion    = "3.14"
venvPath         = "."
venv             = ".venv"

[tool.pytest.ini_options]
testpaths  = ["tests"]
pythonpath = ["."]
addopts    = "--import-mode=importlib"
