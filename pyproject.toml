# Settings for the checks in docs/coding_rules.md (ruff check and pyright only, no formatter)

[tool.ruff]
line-length = 250

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]   # __init__.py の import を「未使用」扱いしない

[tool.pyright]
typeCheckingMode = "standard"
venvPath         = "."
venv             = ".venv"
